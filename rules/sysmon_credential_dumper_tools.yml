title: Known Credential-Dumper Tool Execution
id: lo-sysmon-credential-dumper-tools
description: A process whose image name or original (compiled) filename matches a well-known credential-dumping utility - Mimikatz and its ports, nanodump, pypykatz, SafetyKatz, HandleKatz, lsassy, dumpert. Original-filename matching also catches the tool after it has been renamed on disk.
level: critical
fidelity: high
data_source: [process_creation, sysmon]
references:
  - https://attack.mitre.org/techniques/T1003/001/
detection:
  tool_name:
    - Image|endswith:
        - \mimikatz.exe
        - \nanodump.exe
        - \pypykatz.exe
        - \safetykatz.exe
        - \handlekatz.exe
        - \lsassy.exe
        - \sharpkatz.exe
        - \dumpert.exe
    - OriginalFileName:
        - mimikatz.exe
        - nanodump.exe
        - pypykatz.exe
        - SafetyKatz.exe
        - HandleKatz.exe
        - Dumpert.exe
  tool_arg:
    - CommandLine|contains:
        - "sekurlsa::"
        - "lsadump::"
        - " logonpasswords"
        - "privilege::debug"
        - "!processprotect"
        - "DumpCreds"
    - message|contains:
        - "sekurlsa::"
        - "lsadump::"
        - "privilege::debug"
  condition: tool_name or tool_arg
tags:
  - attack.t1003.001
  - attack.credential_access
falsepositives:
  - Authorized red-team engagements running these tools with prior approval.
