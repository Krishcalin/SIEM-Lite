title: Nutanix Files - Share Permission / ACL Change
id: lo-nutanix-files-permission-change
description: A SECURITY (ACL / permission) change was audited on a Nutanix Files share. Unexpected permission changes can indicate an attacker widening access, breaking inheritance to conceal a backdoor path, or an insider granting themselves rights to sensitive data. Review against the change ticket and the acting user.
level: medium
logsource:
  vendor: nutanix
  product: files
detection:
  sec:
    action: security-change
  condition: sec
tags:
  - attack.t1222
  - attack.t1222.001
  - attack.t1222.002
  - attack.defense_evasion
falsepositives:
  - Planned share re-permissioning, data migrations, or routine IT administration.
