title: WDigest UseLogonCredential Enabled (Plaintext Credential Caching)
id: lo-sysmon-wdigest-uselogoncredential
description: The WDigest UseLogonCredential registry value was set to 1, forcing Windows to cache plaintext credentials in LSASS memory again - a Mimikatz / attacker pre-step that turns a later LSASS dump into cleartext passwords. Detected on the Sysmon registry-set event.
level: high
fidelity: high
data_source: [registry_set, sysmon]
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1112/
logsource:
  vendor: microsoft
  product: sysmon
detection:
  wdigest:
    TargetObject|endswith: \SecurityProviders\WDigest\UseLogonCredential
    Details|contains:
      - "0x00000001"
      - "DWORD (0x00000001)"
      - "0x1"
  condition: wdigest
tags:
  - attack.t1003.001
  - attack.t1112
  - attack.credential_access
  - attack.defense_evasion
falsepositives:
  - Almost none on modern Windows; legacy apps that require WDigest are rare and should be documented.
