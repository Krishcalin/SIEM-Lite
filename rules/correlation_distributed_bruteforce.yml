title: Distributed Brute Force - Many Sources, One Account
id: lo-corr-distributed-bruteforce
level: high
fidelity: medium
data_source: [authentication]
description: A single user account received failed logons from 10 or more distinct source IPs within ten minutes. Spreading guesses across many source addresses (credential stuffing / botnet brute force) evades per-source throttling and is invisible to a per-source failed-count rule.
correlation:
  match:
    action: failed-logon
  group_by:
    - user_name
  distinct_count: src_ip
  window: 10m
  threshold: 10
tags:
  - attack.t1110.004
  - attack.t1110.001
  - attack.credential_access
