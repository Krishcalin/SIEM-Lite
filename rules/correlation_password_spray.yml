title: Password Spray - One Source, Many Accounts
id: lo-corr-password-spray
level: high
fidelity: high
data_source: [authentication]
description: A single source IP produced failed logons against 10 or more distinct user accounts within ten minutes. Trying one or a few passwords across many accounts (rather than many passwords against one account) is password spraying - it evades per-account lockout and is missed by simple failed-count brute-force rules.
correlation:
  match:
    action: failed-logon
  group_by:
    - src_ip
  distinct_count: user_name
  window: 10m
  threshold: 10
tags:
  - attack.t1110.003
  - attack.credential_access
falsepositives:
  - A shared egress IP (corporate NAT / CGNAT / VPN concentrator / SSO reverse proxy) behind which many users fail auth in the same window (e.g. a mass password-expiry morning) - allowlist known egress IPs.
