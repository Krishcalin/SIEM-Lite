title: Web Cross-Site Scripting (XSS) Attempt
id: lo-web-xss
description: An HTTP request contained a script-injection payload (a script tag, a javascript URI, or an inline event handler such as onerror/onload) in the URL - a reflected/stored XSS probe against a public-facing web application.
level: medium
fidelity: medium
data_source: [web, zeek, suricata]
references:
  - https://attack.mitre.org/techniques/T1190/
# Bound to the CIM Web data model rather than to `log_type: [access, http]` -- see
# web_sql_injection.yml. Completes the T1190 web-exploitation set, so all four rules
# see exactly the same population of web requests instead of four copies of a list.
datamodels: web
detection:
  xss:
    message|contains:
      - "<script"
      - "%3cscript"
      - "javascript:"
      - "onerror="
      - "onload="
      - "onmouseover="
      - "<img src=x"
      - "%3cimg"
      - "document.cookie"
      - "<svg/onload"
  condition: xss
tags:
  - attack.t1190
  - attack.initial_access
falsepositives:
  - WYSIWYG / rich-text editors and analytics parameters can carry HTML fragments; tune per application.
