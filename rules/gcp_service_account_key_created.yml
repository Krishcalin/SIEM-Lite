title: GCP Service-Account Key Created
id: lo-gcp-sa-key-created
description: A user-managed key was created for a GCP service account (CreateServiceAccountKey). Long-lived downloadable SA keys are a favoured persistence / credential-theft mechanism - the resulting key can authenticate from anywhere, outside Google's short-lived-token controls.
level: high
fidelity: medium
data_source: [cloud_audit]
logsource:
  vendor: gcp
  product: cloud-audit
detection:
  selection:
    action|contains: CreateServiceAccountKey
  condition: selection
tags:
  - attack.t1098.001
  - attack.persistence
falsepositives:
  - CI/CD or legacy workloads that still require exported SA keys - prefer workload identity and allowlist those service accounts.
