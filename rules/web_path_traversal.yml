title: Web Path Traversal / Local File Inclusion
id: lo-web-path-traversal
description: An HTTP request tried to escape the web root or read a sensitive file (dot-dot-slash sequences, encoded traversal, /etc/passwd, /etc/shadow, php://filter, or win.ini) - directory traversal / LFI against a public-facing web application.
level: high
fidelity: high
data_source: [web, zeek, suricata]
references:
  - https://attack.mitre.org/techniques/T1190/
# Bound to the CIM Web data model rather than to `log_type: [access, http]` -- see
# web_sql_injection.yml. Traversal is a property of the request; the registry decides
# which products emit web requests, so proxy / URL-filter / web-filter sources are
# covered without touching this rule.
datamodels: web
detection:
  traversal:
    message|contains:
      - "../../"
      - "..%2f"
      - "..%5c"
      - "%2e%2e%2f"
      - "%2e%2e/"
      - "....//"
      - "..\\..\\"
      - "/etc/passwd"
      - "/etc/shadow"
      - "php://filter"
      - "php://input"
      - "/windows/win.ini"
      - "\\windows\\win.ini"
      - "file:///"
  condition: traversal
tags:
  - attack.t1190
  - attack.initial_access
falsepositives:
  - Applications that legitimately pass relative paths in parameters (verify the target file).
