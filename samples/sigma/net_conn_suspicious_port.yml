# Example Sigma-format rule (LogOcean importer test fixture; not official SigmaHQ content).
title: Outbound Connection to Common C2 Port
id: 33333333-3333-4333-8333-333333333333
status: test
description: A network connection to a port commonly used by offensive tooling (e.g. 4444).
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
      - 4444
      - 1337
  condition: selection
level: medium
tags:
  - attack.t1571
  - attack.command_and_control
