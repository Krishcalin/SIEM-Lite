<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="LogOcean — agentless SIEM: ingest, parse, normalize, store, detect, alert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15243f"/>
      <stop offset="1" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="conn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="0" y="0" width="800" height="240" rx="18"/></clipPath>
    <style>
      .wm  { font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
      .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .cap { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 8px; fill: #9db3cf; }
      .nl  { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 8.5px; fill: #e2ecf7; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="800" height="240" fill="url(#bg)"/>
    <rect x="0" y="0" width="800" height="240" fill="url(#glow)"/>

    <!-- ===== Wordmark ===== -->
    <g transform="translate(40,46)">
      <path d="M0 -15 L21 -22 L42 -15 L42 5 Q42 20 21 28 Q0 20 0 5 Z" fill="url(#node)" stroke="url(#accent)" stroke-width="1.6"/>
      <path d="M5 2 Q13 -6 21 2 T38 2" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M5 11 Q13 3 21 11 T38 11" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round"/>
      <text x="60" y="9" class="wm" font-size="37" font-weight="700" fill="#e8eff8">Log<tspan fill="url(#accent)">Ocean</tspan></text>
      <text x="63" y="28" class="mono" font-size="10.5" letter-spacing="2.2" fill="#8298b4">AGENTLESS  SIEM  ·  LOG  PIPELINE</text>
    </g>

    <!-- ===== Multi-domain source streams feeding INGEST ===== -->
    <g class="mono" font-size="8.5" fill="#9db3cf" text-anchor="end">
      <text x="84" y="118">web upload</text>
      <text x="84" y="140">http api</text>
      <text x="84" y="162">syslog</text>
    </g>
    <g fill="none" stroke-width="2.2" stroke-linecap="round">
      <path d="M90 114 C118 114 126 140 150 140" stroke="#38bdf8"/>
      <path d="M90 136 C116 136 124 140 150 140" stroke="#2dd4bf"/>
      <path d="M90 158 C118 158 126 140 150 140" stroke="#22c55e"/>
    </g>
    <text class="mono" x="150" y="96" font-size="7.5" fill="#6f88a3" text-anchor="middle">network · endpoint · cloud · identity · ot/ics</text>

    <!-- ===== Pipeline connectors + arrows ===== -->
    <g stroke="url(#conn)" stroke-width="3" fill="none">
      <line x1="184" y1="140" x2="223" y2="140"/>
      <line x1="291" y1="140" x2="330" y2="140"/>
      <line x1="398" y1="140" x2="437" y2="140"/>
      <line x1="505" y1="140" x2="544" y2="140"/>
      <line x1="612" y1="140" x2="650" y2="140"/>
    </g>
    <g fill="#2dd4bf">
      <polygon points="223,140 215,135 215,145"/>
      <polygon points="330,140 322,135 322,145"/>
      <polygon points="437,140 429,135 429,145"/>
      <polygon points="544,140 536,135 536,145"/>
      <polygon points="650,140 642,135 642,145"/>
    </g>

    <!-- ===== Stage nodes: INGEST > PARSE > NORMALIZE > STORE > DETECT > ALERT ===== -->
    <g text-anchor="middle">
      <!-- INGEST -->
      <g transform="translate(150,140)">
        <rect x="-33" y="-22" width="66" height="44" rx="9" fill="url(#node)" stroke="url(#accent)" stroke-width="1.5"/>
        <path d="M-9 -3 L0 -12 L9 -3 M0 -12 L0 8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="0" y="17" class="nl">INGEST</text>
        <text x="0" y="34" class="cap">auto-detect</text>
      </g>
      <!-- PARSE -->
      <g transform="translate(257,140)">
        <rect x="-33" y="-22" width="66" height="44" rx="9" fill="url(#node)" stroke="url(#accent)" stroke-width="1.5"/>
        <text x="0" y="-1" class="mono" font-size="12" fill="#2dd4bf">&lt;/&gt;</text>
        <text x="0" y="17" class="nl">PARSE</text>
        <text x="0" y="34" class="cap">29 parsers</text>
      </g>
      <!-- NORMALIZE -->
      <g transform="translate(364,140)">
        <rect x="-33" y="-22" width="66" height="44" rx="9" fill="url(#node)" stroke="url(#accent)" stroke-width="1.5"/>
        <g stroke="#2dd4bf" stroke-width="2" stroke-linecap="round">
          <line x1="-9" y1="-8" x2="9" y2="-8"/><line x1="-9" y1="-3" x2="4" y2="-3"/><line x1="-9" y1="2" x2="9" y2="2"/>
        </g>
        <text x="0" y="17" class="nl" font-size="8">NORMALIZE</text>
        <text x="0" y="34" class="cap">schema map</text>
      </g>
      <!-- STORE -->
      <g transform="translate(471,140)">
        <rect x="-33" y="-22" width="66" height="44" rx="9" fill="url(#node)" stroke="url(#accent)" stroke-width="1.5"/>
        <g fill="none" stroke="#38bdf8" stroke-width="1.8">
          <ellipse cx="0" cy="-9" rx="12" ry="4"/><path d="M-12 -9 V4 Q0 8 12 4 V-9"/><path d="M-12 -3 Q0 1 12 -3"/>
        </g>
        <text x="0" y="17" class="nl">STORE</text>
        <text x="0" y="34" class="cap">postgres · monthly</text>
      </g>
      <!-- DETECT -->
      <g transform="translate(578,140)">
        <rect x="-33" y="-22" width="66" height="44" rx="9" fill="url(#node)" stroke="url(#accent)" stroke-width="1.5"/>
        <circle cx="-2" cy="-5" r="7" fill="none" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="3.5" y1="0.5" x2="9" y2="6" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
        <text x="0" y="17" class="nl">DETECT</text>
        <text x="0" y="34" class="cap">sigma rules</text>
      </g>
      <!-- ALERT -->
      <g transform="translate(684,140)">
        <rect x="-33" y="-22" width="66" height="44" rx="9" fill="url(#node)" stroke="url(#accent)" stroke-width="1.5"/>
        <path d="M0 -12 L11 7 L-11 7 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
        <line x1="0" y1="-4" x2="0" y2="1" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="4" r="1.3" fill="#fbbf24"/>
        <text x="0" y="17" class="nl">ALERT</text>
        <text x="0" y="34" class="cap">triage · cases</text>
      </g>
    </g>

    <!-- coverage / threat-intel handoff from ALERT -->
    <path d="M712 130 C742 124 754 110 772 110" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-dasharray="3 3"/>
    <circle cx="772" cy="110" r="2.2" fill="#5eead4"/>
    <g class="mono" font-size="8" fill="#5eead4" text-anchor="end">
      <text x="786" y="98">MITRE ATT&amp;CK / ATLAS</text>
      <text x="786" y="110">coverage · threat-intel</text>
    </g>

    <!-- ===== Layered ocean = the data store ===== -->
    <g transform="translate(0,196)">
      <path d="M0 6 Q80 0 160 5 T320 5 T480 5 T640 5 T800 5 V50 H0 Z" fill="url(#wave3)"/>
      <path d="M0 12 Q80 6 160 11 T320 11 T480 11 T640 11 T800 11 V50 H0 Z" fill="url(#wave2)"/>
      <path d="M0 18 Q80 12 160 17 T320 17 T480 17 T640 17 T800 17 V50 H0 Z" fill="url(#wave1)"/>
      <g stroke="#0b1220" stroke-width="1.4" opacity="0.2">
        <line x1="100" y1="16" x2="100" y2="46"/><line x1="220" y1="16" x2="220" y2="46"/>
        <line x1="340" y1="16" x2="340" y2="46"/><line x1="460" y1="16" x2="460" y2="46"/>
        <line x1="580" y1="16" x2="580" y2="46"/><line x1="700" y1="16" x2="700" y2="46"/>
      </g>
      <path d="M0 18 Q80 12 160 17 T320 17 T480 17 T640 17 T800 17" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.45"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="798.5" height="238.5" rx="17.5" fill="none" stroke="#1e3350"/>
</svg>
