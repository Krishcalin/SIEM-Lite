name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # `httpx` is TEST tooling, not an app dependency, which is why it is here and
      # not in requirements.txt: `starlette.testclient.TestClient` refuses to
      # construct without it, and the HEC shim's 22 HTTP-surface tests go through it.
      # The integration job below has always installed it; this job did not, so from
      # the moment those tests landed every unit matrix leg failed on a RuntimeError
      # raised inside starlette — while the same suite was green locally, where httpx
      # arrives as a transitive dependency of something else.
      #
      # `cryptography` is DELIBERATELY ABSENT here. It is optional — the vault disables
      # itself without it and credentials fall back to environment variables — and
      # leaving it out is what keeps that degraded path exercised on every run:
      # `crypto.is_available()` returns False and the vault tests skip. The
      # integration job installs it, so the real AES path is covered there. Between
      # the two jobs, both branches are tested.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Byte-compile the app (syntax check, incl. modules tests don't import)
        run: python -m compileall app -q

      - name: Run unit tests (DB-free)
        run: python -m pytest tests/ -m "not integration" -q
        env:
          PYTHONPATH: .

  integration:
    name: integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logocean
          POSTGRES_PASSWORD: logocean
          POSTGRES_DB: logocean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logocean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # `cryptography` IS installed here, unlike the unit job. The vault stores
      # collector credentials, and its bytea round trip (psycopg returns `memoryview`,
      # not `bytes`) is precisely what a DB-free test cannot cover — so the one job
      # that has a database is the one that must exercise it for real. Without it
      # those nine tests FAILED rather than skipped, and this job was red for it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx cryptography

      # ------------------------------------------------------------------ #
      #  Why three steps and not one                                       #
      # ------------------------------------------------------------------ #
      # This job reported GREEN while executing ZERO tests for roughly 70
      # commits. Two independent holes did it: import-time errors made the
      # whole integration suite fail collection, and a DSN that was unset or
      # unreachable made every test skip — and a run of nothing but skips
      # exits 0. `tests/conftest.py` now fails a run that collected
      # integration tests, had a DSN and executed none of them, which is the
      # real guard and protects local runs too. These steps exist so the
      # failure is FAST and LEGIBLE instead of arriving as a fixture error
      # partway down a long log.
      - name: Verify PostgreSQL is actually reachable
        run: |
          pg_isready -d "$DB_DSN" \
            || { echo "::error::PostgreSQL is not reachable at DB_DSN — the integration job would otherwise skip every test and still exit 0"; exit 1; }
          psql "$DB_DSN" -v ON_ERROR_STOP=1 -c 'SELECT version();'
        env:
          DB_DSN: postgresql://logocean:logocean@localhost:5432/logocean

      - name: Verify the integration suite collects (catches import-time errors)
        run: |
          n=$(python -m pytest tests/ -m integration --collect-only -q 2>&1 | tail -1)
          echo "collected: $n"
          python -m pytest tests/ -m integration --collect-only -q > /dev/null \
            || { echo "::error::the integration suite does not collect — every test would 'fail' as a collection error and the DB claims would go unverified"; exit 1; }
        env:
          PYTHONPATH: .
          DB_DSN: postgresql://logocean:logocean@localhost:5432/logocean

      # The MMDB reader is a binary-format parser written from the published spec with
      # no `maxminddb` to check it against. Its own tests round-trip through a writer
      # THIS PROJECT also wrote — which proves the offset chain is internally coherent
      # and cannot prove it agrees with a real file, because a reader and a writer that
      # misunderstand the format the same way round-trip perfectly. A wrong answer
      # there is a plausible wrong country on a stored event, not a crash.
      #
      # So CI fetches MaxMind's OWN published test databases and asserts known answers
      # against them. They are not vendored: they are MaxMind's files, and this keeps
      # the repo free of third-party data. `continue-on-error` is deliberately NOT set
      # — if the fetch breaks, the conformance suite skips, and a silent skip is
      # exactly what this step exists to prevent.
      - name: Fetch MaxMind's published test databases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmdb"
          base=https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data
          files="GeoIP2-Country-Test.mmdb GeoLite2-ASN-Test.mmdb"
          files="$files MaxMind-DB-test-ipv4-24.mmdb MaxMind-DB-test-ipv4-28.mmdb"
          files="$files MaxMind-DB-test-ipv4-32.mmdb MaxMind-DB-test-decoder.mmdb"
          for f in $files; do
            if ! curl -sSfL -o "$RUNNER_TEMP/mmdb/$f" "$base/$f"; then
              echo "::error::could not fetch $f - the MMDB conformance suite would silently skip"
              exit 1
            fi
          done
          ls -l "$RUNNER_TEMP/mmdb"

      - name: Run integration tests against PostgreSQL
        run: python -m pytest tests/ -m integration -q
        env:
          PYTHONPATH: .
          DB_DSN: postgresql://logocean:logocean@localhost:5432/logocean

      # Not marked `integration` (it needs no database), so it is in neither run above;
      # it needs the fetched corpus, which only this job has. The skip check is the
      # point of the step: a conformance suite that silently skips is worse than one
      # that does not exist, because the reader LOOKS verified.
      - name: Run the MMDB conformance suite against real MaxMind databases
        run: |
          set -euo pipefail
          out=$(python -m pytest tests/test_mmdb_conformance.py -q)
          echo "$out"
          case "$out" in
            *skipped*)
              echo "::error::the MMDB conformance suite SKIPPED - MMDB_TEST_DATA is not reaching it, so the from-spec reader is unverified against real vendor output"
              exit 1 ;;
          esac
        env:
          PYTHONPATH: .
          MMDB_TEST_DATA: ${{ runner.temp }}/mmdb
